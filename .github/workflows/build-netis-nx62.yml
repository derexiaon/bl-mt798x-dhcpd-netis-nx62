name: Build Netis NX62 bootloader (multi-layout)

# BL2 + FIP (BL31 + U-Boot with DHCPD and failsafe web UI) for
# Netis NX62 / Netcore N60 Pro (MT7986A, 128 MiB SPI-NAND).
#
# The bootloader works on the raw SPI-NAND (no NMBM), like the official
# OpenWrt bootloader, and offers two MTD layouts in the web UI:
#   default - stock firmware and NMBM based builds (ubi = 117248k)
#   openwrt - official OpenWrt / ImmortalWrt netcore_n60-pro (ubi = 125440k)
# See document/netis-nx62.md for flashing instructions.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'ATF version (SP2 = ATF 2026.01.23, 2025 = ATF 2025.07.11)'
        required: true
        default: 'SP2 + 2025'
        type: choice
        options:
          - 'SP2 + 2025'
          - 'SP2'
          - '2025'
      release:
        description: 'Publish a GitHub Release with the images'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - '.github/workflows/build-netis-nx62.yml'
      - 'build.sh'
      - 'document/netis-nx62.md'
      - 'atf-20250711/**'
      - 'atf-20260123/**'
      - 'uboot-mtk-20250711/**'

permissions:
  contents: read

concurrency:
  group: netis-nx62-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          case "${{ github.event.inputs.versions || 'SP2 + 2025' }}" in
            'SP2') echo 'matrix=["SP2"]' >> "$GITHUB_OUTPUT" ;;
            '2025') echo 'matrix=["2025"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'matrix=["SP2","2025"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      BOARD: netis_nx62
      VARIANT: nonmbm
      MULTI_LAYOUT: '1'
      FIXED_MTDPARTS: '1'
      SILENT: 'Y'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js (failsafe web UI minifier)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential bc bison flex \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler libssl-dev libgnutls28-dev
          aarch64-linux-gnu-gcc --version | head -1
          python --version

      - name: Build BL2 + FIP (${{ matrix.version }})
        run: |
          chmod +x build.sh
          VERSION=${{ matrix.version }} ./build.sh 2>&1 | tee build-${{ matrix.version }}.log
          exit "${PIPESTATUS[0]}"

      - name: Verify images
        run: |
          set -euo pipefail
          bl2=$(ls output/bl2-mt7986_${BOARD}_${{ matrix.version }}-nonmbm_*.img)
          fip=$(ls output/fip-mt7986_${BOARD}_${{ matrix.version }}-*-nonmbm-fixed-parts-multi-layout_*.bin)

          # Partition sizes: bl2 = 1 MiB, fip = 2 MiB
          [ "$(stat -c%s "$bl2")" -le $((1024 * 1024)) ] || { echo "BL2 too large"; exit 1; }
          [ "$(stat -c%s "$fip")" -le $((2048 * 1024)) ] || { echo "FIP too large"; exit 1; }

          # BL2 must be built without NMBM (skip-bad), BL31 with TRNG
          # access for the stock kernel, U-Boot with both layouts.
          atf=$(case "${{ matrix.version }}" in SP2) echo atf-20260123 ;; *) echo atf-20250711 ;; esac)
          grep -q '^_NAND_SKIP_BAD=y' "$atf/build/.config"
          if grep -q '^NMBM=1' "$atf/build/.config"; then echo "BL2 built with NMBM"; exit 1; fi
          grep -q '^MT7986_TRNG_NS_ACCESS=1' "$atf/build/.config"
          grep -q '^CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y' uboot-mtk-20250711/.config
          if grep -q '^CONFIG_ENABLE_NAND_NMBM=y' uboot-mtk-20250711/.config; then echo "U-Boot built with NMBM"; exit 1; fi
          dtc -I dtb -O dts uboot-mtk-20250711/dts/dt.dtb 2>/dev/null > dt.dts
          grep -q 'model = "Netis NX62"' dt.dts
          grep -q '117248k(ubi)' dt.dts
          grep -q '125440k(ubi)' dt.dts

          mkdir -p upload
          cp "$bl2" upload/netis_nx62-${{ matrix.version }}-bl2.img
          cp "$fip" upload/netis_nx62-${{ matrix.version }}-fip.bin
          cp document/netis-nx62.md upload/README-netis-nx62.md
          gzip -9c build-${{ matrix.version }}.log > upload/build-${{ matrix.version }}.log.gz
          (cd upload && sha256sum *.img *.bin > SHA256SUMS)
          cat upload/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: netis_nx62-bootloader-${{ matrix.version }}
          path: upload/*
          retention-days: 90

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release
        id: meta
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum *.img *.bin > SHA256SUMS
          echo "tag=netis-nx62-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Netis NX62 bootloader ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Netis NX62 / Netcore N60 Pro bootloader (BL2 + FIP), multi-layout,
            no NMBM, DHCPD + failsafe web UI.
            Layouts: `default` (stock firmware, ubi 117248k) and
            `openwrt` (official OpenWrt netcore_n60-pro, ubi 125440k).
            Read README-netis-nx62.md before flashing.
          files: |
            dist/*.img
            dist/*.bin
            dist/SHA256SUMS
            dist/README-netis-nx62.md
