name: Build Netis NX62 bootloader

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'ATF version (SP2 = ATF 2026.01.23, 2025 = ATF 2025.07.11)'
        required: true
        default: 'SP2 + 2025'
        type: choice
        options:
          - 'SP2 + 2025'
          - 'SP2'
          - '2025'
      upstream_ref:
        description: 'Upstream bl-mt798x-dhcpd commit/branch (empty = pinned in build.sh, "master" = latest)'
        required: false
        default: ''
        type: string
      release:
        description: 'Publish a GitHub Release with the images'
        required: false
        default: false
        type: boolean
      delete_old_releases:
        description: 'After publishing, delete all older releases and their tags'
        required: false
        default: true
        type: boolean
  push:
  # Weekly trial build against the latest upstream, to notice breakage early
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: netis-nx62-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      upstream_ref: ${{ steps.set.outputs.upstream_ref }}
    steps:
      - id: set
        run: |
          case "${{ github.event.inputs.versions || 'SP2 + 2025' }}" in
            'SP2') echo 'matrix=["SP2"]' >> "$GITHUB_OUTPUT" ;;
            '2025') echo 'matrix=["2025"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'matrix=["SP2","2025"]' >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'upstream_ref=master' >> "$GITHUB_OUTPUT"
          else
            echo 'upstream_ref=${{ github.event.inputs.upstream_ref }}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js (failsafe web UI minifier)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            build-essential bc bison flex \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler libssl-dev libgnutls28-dev

      - name: Build and verify (${{ matrix.version }})
        env:
          VERSION: ${{ matrix.version }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
        run: |
          [ -n "$UPSTREAM_REF" ] || unset UPSTREAM_REF
          ./build.sh 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Collect files
        if: always()
        run: |
          mkdir -p output
          cp README.md output/README-netis-nx62.md
          cp README.ru.md output/README-netis-nx62.ru.md
          gzip -9c build.log > output/build-${{ matrix.version }}.log.gz || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netis_nx62-bootloader-${{ matrix.version }}
          path: output/*
          retention-days: 90

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Prepare release
        id: meta
        run: |
          cd dist
          sha256sum *.img *.bin > SHA256SUMS
          # One zip per ATF version (forums like 4PDA don't accept .bin/.img)
          for v in $(ls netis_nx62-*-bl2.img | sed -E 's/netis_nx62-(.*)-bl2.img/\1/'); do
            grep "netis_nx62-$v-" SHA256SUMS > "SHA256SUMS-$v"
            zip -9 -j "netis_nx62-$v.zip" "netis_nx62-$v-bl2.img" "netis_nx62-$v-fip.bin" \
              "SHA256SUMS-$v" README-netis-nx62.md README-netis-nx62.ru.md
            rm "SHA256SUMS-$v"
          done
          unzip -l netis_nx62-SP2.zip
          echo "tag=netis-nx62-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "upstream=$(cat upstream-commit.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Netis NX62 bootloader ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Netis NX62 / Netcore N60 Pro: BL2 + FIP, multi-layout, no NMBM, DHCP + failsafe web UI.
            Layouts: `default` (stock, ubi 117248k) and `openwrt` (official OpenWrt 25.12+ / ImmortalWrt 24.10+ netcore_n60-pro, ubi 125440k).
            Upstream bl-mt798x-dhcpd: ${{ steps.meta.outputs.upstream }}
            Read README-netis-nx62.md before flashing. `netis_nx62-<version>.zip` = both images + checksums + README.

            Netis NX62 / Netcore N60 Pro: BL2 + FIP, multi-layout, без NMBM, DHCP + веб-интерфейс восстановления.
            Разметки: `default` (сток, ubi 117248k) и `openwrt` (официальный OpenWrt 25.12+ / ImmortalWrt 24.10+ netcore_n60-pro, ubi 125440k).
            Перед прошивкой прочитайте README-netis-nx62.ru.md. `netis_nx62-<версия>.zip` — оба образа, контрольные суммы и README.
          files: |
            dist/*.img
            dist/*.bin
            dist/*.zip
            dist/SHA256SUMS
            dist/README-netis-nx62.md
            dist/README-netis-nx62.ru.md

      - name: Delete older releases
        if: github.event.inputs.delete_old_releases == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release list --limit 500 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            [ "$tag" = "$NEW_TAG" ] && continue
            echo "Deleting release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
